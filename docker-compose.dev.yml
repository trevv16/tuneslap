services:
  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile.dev
    ports:
      - "8082:8082"
    environment:
      # Connection strings for docker services
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis:6379
      - PORT=8082
      # App config
      - DATABASE=${DATABASE:-tuneslap}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - DEMO_MODE=${DEMO_MODE:-true}
      # Storage configuration (defaults to MinIO)
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-s3}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_EXTERNAL_ENDPOINT=${S3_EXTERNAL_ENDPOINT:-http://localhost:9000}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - MEDIA_BUCKET=${MEDIA_BUCKET:-tuneslap-media}
      - USER_UPLOADS_BUCKET=${USER_UPLOADS_BUCKET:-tuneslap-uploads}
    volumes:
      # Mount server code for hot reloading
      - ./server:/app
      - ./server/keys:/app/keys
      # Exclude build artifacts
      - /app/tmp
    command: air
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - tuneslap-network

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.dev
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8082/api/v1}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
      - NEXT_PUBLIC_DEMO_MODE=${DEMO_MODE:-true}
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://server:8082/api/v1}
      - WATCHPACK_POLLING=true
    volumes:
      # Mount project root for type generation script access
      - .:/workspace
      # Preserve node_modules and .next as volumes (populated from image)
      - frontend_node_modules:/workspace/frontend/node_modules
      - frontend_next:/workspace/frontend/.next
    working_dir: /workspace/frontend
    command: yarn dev
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - tuneslap-network

  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    attach: false # Don't attach to the console for cleaner logs in dev
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - tuneslap-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - tuneslap-network
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - tuneslap-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      mc mb myminio/tuneslap-media --ignore-existing;
      mc mb myminio/tuneslap-uploads --ignore-existing;
      mc anonymous set public myminio/tuneslap-media;
      mc anonymous set public myminio/tuneslap-uploads;
      echo 'Buckets created successfully';
      "
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
    networks:
      - tuneslap-network
    restart: no

  openapi:
    build:
      context: ./openapi
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    volumes:
      - ./openapi:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      - tuneslap-network

volumes:
  mongodb_data:
  redis_data:
  minio_data:
  frontend_node_modules:
  frontend_next:

networks:
  tuneslap-network:
    driver: bridge
