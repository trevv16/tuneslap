services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
    environment:
      # Override connection strings to point to docker services
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis:6379
      - PORT=8080
      # Storage configuration (defaults to MinIO)
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-s3}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_EXTERNAL_ENDPOINT=${S3_EXTERNAL_ENDPOINT:-http://localhost:9000}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - MEDIA_BUCKET=${MEDIA_BUCKET:-tuneslap-media}
      - USER_UPLOADS_BUCKET=${USER_UPLOADS_BUCKET:-tuneslap-uploads}
    volumes:
      # Mount the keys directory so it can see keys generated by setup-keys service (if using GCS)
      - ./server/keys:/app/keys
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - tuneslap-network

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      # If SSR needs to talk to server container directly:
      # - INTERNAL_API_URL=http://server:8080
    depends_on:
      - server
    restart: on-failure
    networks:
      - tuneslap-network

  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - tuneslap-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - tuneslap-network
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - tuneslap-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    env_file:
      - ./server/.env
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin};
      MEDIA_BUCKET=\"$${MEDIA_BUCKET:-tuneslap-media}\";
      USER_UPLOADS_BUCKET=\"$${USER_UPLOADS_BUCKET:-tuneslap-uploads}\";
      mc mb myminio/tuneslap-user-uploads-staging --ignore-existing || true;
      mc anonymous set public myminio/tuneslap-user-uploads-staging || true;
      mc mb myminio/$$MEDIA_BUCKET --ignore-existing;
      mc mb myminio/$$USER_UPLOADS_BUCKET --ignore-existing;
      mc anonymous set public myminio/$$MEDIA_BUCKET;
      mc anonymous set public myminio/$$USER_UPLOADS_BUCKET;
      echo \"Buckets created: $$MEDIA_BUCKET, $$USER_UPLOADS_BUCKET, tuneslap-user-uploads-staging\";
      "
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - MEDIA_BUCKET=${MEDIA_BUCKET:-tuneslap-media}
      - USER_UPLOADS_BUCKET=${USER_UPLOADS_BUCKET:-tuneslap-uploads}
    networks:
      - tuneslap-network
    restart: no

  setup-keys:
    image: google/cloud-sdk:alpine
    environment:
      - GOOGLE_PRIVATE_KEY_PATH=keys/tuneslap-api-staging-key.json
    volumes:
      # Mount scripts
      - ./scripts:/scripts
      # Mount server/keys to where the script writes keys
      # The script writes to "keys/..." relative to where it runs
      # We will run it in /workspace
      - ./server/keys:/workspace/keys
      # Mount user's gcloud credentials to allow authentication
      # This assumes the user has run 'gcloud auth login' on their host machine
      - ~/.config/gcloud:/root/.config/gcloud
    working_dir: /workspace
    # Run the ensure-keys wrapper script
    entrypoint: ["/bin/bash", "/scripts/ensure-keys.sh"]
    # We don't want this to restart, it runs once and exits
    restart: no
    profiles:
      - gcs-setup
    networks:
      - tuneslap-network

volumes:
  mongodb_data:
  redis_data:
  minio_data:

networks:
  tuneslap-network:
    driver: bridge
