openapi: '3.0.3'
info:
  title: Media API
  version: '1.0.0'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    mediaId:
      name: mediaId
      description: The ID of the media
      in: path
      required: true
      schema:
        $ref: './common.yaml#/components/schemas/MongoObjectId'
  schemas:
    MediaType:
      type: string
      description: The type of media
      enum:
        - image
        - audio
    ProcessingStatus:
      type: string
      description: The processing status of the media
      enum:
        - pending
        - processing
        - done
        - error
    ContentType:
      type: string
      description: The content type of the file
      enum:
        - audio/mp3
        - audio/wav
        - audio/webm
        - audio/ogg
        - audio/aac
        - image/jpeg
        - image/png
        - image/gif
        - image/webp
        - image/svg+xml
    AudioOutputFormat:
      type: string
      description: The output format for audio processing
      enum:
        - mp3
        - wav
        - webm
        - ogg
        - aac
    ImageOutputFormat:
      type: string
      description: The output format for image processing
      enum:
        - jpeg
        - png
        - gif
        - webp
        - svg
    AspectRatio:
      type: string
      description: The aspect ratio for image processing
      enum:
        - "1:1"
        - "4:3"
        - "16:9"
        - "16:10"
        - "3:2"
        - "5:4"
    ImageFilter:
      type: string
      description: The image filters that can be applied
      enum:
        - grayscale
        - blur
        - sharpen
        - brightness
        - contrast
        - saturation
        - hue
        - sepia
        - invert
    ProcessingActivity:
      title: MediaProcessingActivity
      type: object
      required:
        - status
        - message
        - createdAt
        - updatedAt
      properties:
        status:
          $ref: '#/components/schemas/ProcessingStatus'
        message:
          type: string
          minLength: 1
          maxLength: 500
          example: Processing completed successfully
        createdAt:
          $ref: './common.yaml#/components/schemas/Timestamp'
        updatedAt:
          $ref: './common.yaml#/components/schemas/Timestamp'
    AudioProcessingParams:
      title: MediaProcessingParamsAudio
      type: object
      required:
        - outputFormats
      properties:
        contentType:
          $ref: '#/components/schemas/ContentType'
        trimStart:
          type: number
          description: Start time in seconds
          minimum: 0
          maximum: 3600
          example: 0.0
        trimEnd:
          type: number
          description: End time in seconds
          minimum: 0
          maximum: 3600
          example: 30.0
        normalize:
          type: boolean
          description: Whether to normalize the audio
        fadeIn:
          type: number
          description: Fade in duration in seconds
          minimum: 0
          maximum: 60
          example: 1.0
        fadeOut:
          type: number
          description: Fade out duration in seconds
          minimum: 0
          maximum: 60
          example: 1.0
        speed:
          type: number
          description: Speed multiplier
          minimum: 0.1
          maximum: 10
          example: 1.0
        pitch:
          type: number
          description: Pitch in semitones
          minimum: -24
          maximum: 24
          example: 0.0
        outputFormats:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/AudioOutputFormat'
          description: Output formats
          example: ["webm", "mp3"]
    ImageProcessingParams:
      type: object
      required:
        - format
      properties:
        resizeTo:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
            minimum: 1
            maximum: 8192
          description: Resize dimensions [width, height]
          example: [1920, 1080]
        format:
          $ref: '#/components/schemas/ImageOutputFormat'
        crop:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: integer
            minimum: 0
            maximum: 8192
          description: Crop dimensions [x, y, width, height]
          example: [0, 0, 1920, 1080]
        aspectRatio:
          $ref: '#/components/schemas/AspectRatio'
        applyFilters:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ImageFilter'
          description: Filters to apply
          example: ["grayscale", "blur"]
    ProcessingParams:
      title: MediaProcessingParams
      type: object
      properties:
        audio:
          $ref: '#/components/schemas/AudioProcessingParams'
        image:
          $ref: '#/components/schemas/ImageProcessingParams'
    MediaResponse:
      title: MediaResponse
      type: object
      required:
        - id
        - authorId
        - mediaType
        - fileName
        - fileUrl
        - fileSize
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: './common.yaml#/components/schemas/MongoObjectId'
        authorId:
          $ref: './common.yaml#/components/schemas/MongoObjectId'
        mediaType:
          $ref: '#/components/schemas/MediaType'
        fileName:
          $ref: './common.yaml#/components/schemas/DefaultName'
        description:
          type: string
          description: Optional description of the media
          maxLength: 1000
          example: "A beautiful sunset image"
        fileUrl:
          type: string
          description: The URL of the original file
          minLength: 10
          maxLength: 2048
          example: https://example.com/file.mp3
        processedUrl:
          type: string
          description: The URL of the processed file
          minLength: 10
          maxLength: 2048
          example: https://example.com/processed.mp3
        waveformUrl:
          type: string
          description: The URL of the waveform image
          minLength: 10
          maxLength: 2048
          example: https://example.com/waveform.png
        contentType:
          $ref: '#/components/schemas/ContentType'
        fileSize:
          type: integer
          description: The size of the file in bytes
          minimum: 1
          maximum: 10737418240
          example: 1024000
        status:
          $ref: '#/components/schemas/ProcessingStatus'
        processingParams:
          $ref: '#/components/schemas/ProcessingParams'
        processingActivity:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProcessingActivity'
        dimensions:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
            minimum: 1
            maximum: 8192
          description: The dimensions of the media [width, height]
          example: [1920, 1080]
        duration:
          type: number
          description: The duration of the media in seconds
          minimum: 0
          maximum: 3600
          example: 30.5
        createdAt:
          $ref: './common.yaml#/components/schemas/Timestamp'
        updatedAt:
          $ref: './common.yaml#/components/schemas/Timestamp'
    MediaStatsResponse:
      title: GetMyMediaStatsResponse
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
          minLength: 1
          maxLength: 255
          example: Media stats retrieved successfully
        data:
          type: object
          required:
            - imageCount
            - audioCount
            - usedStorage
            - availableStorage
          properties:
            imageCount:
              type: integer
              description: Number of images
              minimum: 0
              example: 10
            audioCount:
              type: integer
              description: Number of audio files
              minimum: 0
              example: 5
            usedStorage:
              type: integer
              description: Used storage in bytes
              minimum: 0
              example: 1073741824
            availableStorage:
              type: integer
              description: Available storage in bytes
              minimum: 0
              example: 10737418240
    MediaListResponse:
      title: GetAllMediaResponse
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
          minLength: 1
          maxLength: 255
          example: Media retrieved successfully
        data:
          title: GetAllMediaData
          type: object
          required:
            - media
            - pagination
          properties:
            media:
              type: array
              maxItems: 1000
              items:
                title: MediaListItem
                $ref: '#/components/schemas/MediaResponse'
            pagination:
              $ref: './common.yaml#/components/schemas/PaginationMeta'
    CreateMediaRequest:
      type: object
      required:
        - mediaType
        - fileName
        - fileUrl
        - fileSize
      properties:
        mediaType:
          $ref: '#/components/schemas/MediaType'
        fileName:
          $ref: './common.yaml#/components/schemas/DefaultName'
        description:
          type: string
          description: Optional description of the media
          maxLength: 1000
          example: "A beautiful sunset image"
        fileUrl:
          type: string
          description: The URL of the original file
          minLength: 10
          maxLength: 2048
          example: https://example.com/file.mp3
        contentType:
          $ref: '#/components/schemas/ContentType'
        fileSize:
          type: integer
          description: The size of the file in bytes
          minimum: 1
          maximum: 10737418240
          example: 1024000
        dimensions:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
            minimum: 1
            maximum: 8192
          description: The dimensions of the media [width, height]
          example: [1920, 1080]
        duration:
          type: number
          description: The duration of the media in seconds
          minimum: 0
          maximum: 3600
          example: 30.5
        status:
          $ref: '#/components/schemas/ProcessingStatus'
    CreateMediaResponse:
      title: CreateMediaResponse
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
          minLength: 1
          maxLength: 255
          example: Media created successfully
        data:
          $ref: '#/components/schemas/MediaResponse'
    UpdateMediaRequest:
      type: object
      properties:
        description:
          type: string
          description: Optional description of the media
          maxLength: 1000
          example: "A beautiful sunset image"
    UpdateMediaResponse:
      title: UpdateMediaResponse
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
          minLength: 1
          maxLength: 255
          example: Media updated successfully
        data:
          $ref: '#/components/schemas/MediaResponse'
    DeleteMediaResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        message:
          type: string
          minLength: 1
          maxLength: 255
          example: Media deleted successfully
    ProcessMediaResponse:
      title: ProcessMediaResponse
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
          minLength: 1
          maxLength: 255
          example: Media processing started
        data:
          $ref: '#/components/schemas/MediaResponse'

security:
  - bearerAuth: []

paths:
  /media/stats:
    get:
      summary: Get media stats
      description: Returns media statistics for the authenticated user
      operationId: getMyMediaStats
      tags: [media]
      responses:
        '200':
          description: The media stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaStatsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                title: GetMyMediaStatsUnauthorizedResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                title: GetMyMediaStatsErrorResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                title: GetMyMediaStatsServerErrorResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
  /media:
    get:
      summary: Get all media
      description: Returns all media for a user with optional filtering
      operationId: getAllMedia
      tags: [media]
      parameters:
        - $ref: './common.yaml#/components/parameters/page'
        - $ref: './common.yaml#/components/parameters/limit'
        - name: mediaType
          in: query
          description: Filter media by type
          schema:
            $ref: './common.yaml#/components/schemas/MediaTypeFilter'
        - name: contentType
          in: query
          description: Filter media by content type
          schema:
            $ref: './common.yaml#/components/schemas/ContentTypeFilter'
      responses:
        '200':
          description: The media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                title: GetAllMediaUnauthorizedResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                title: GetAllMediaErrorResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                title: GetAllMediaServerErrorResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
    post:
      summary: Create media
      description: Creates a new media item
      operationId: createMedia
      tags: [media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaRequest'
      responses:
        '201':
          description: The media created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMediaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                title: CreateMediaUnauthorizedResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                title: CreateMediaErrorResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                title: CreateMediaServerErrorResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
  /media/{mediaId}:
    get:
      summary: Get media by ID
      description: Returns the media with the given ID
      operationId: getMediaById
      tags: [media]
      parameters:
        - $ref: '#/components/parameters/mediaId'
      responses:
        '200':
          description: The media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                title: GetMediaByIdUnauthorizedResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Media not found
          content:
            application/json:
              schema:
                title: GetMediaByIdNotFoundResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                title: GetMediaByIdErrorResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                title: GetMediaByIdServerErrorResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
    patch:
      summary: Update media
      description: Updates the media with the given ID
      operationId: updateMedia
      tags: [media]
      parameters:
        - $ref: '#/components/parameters/mediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMediaRequest'
      responses:
        '200':
          description: The media updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMediaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                title: UpdateMediaUnauthorizedResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Media not found
          content:
            application/json:
              schema:
                title: UpdateMediaNotFoundResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                title: UpdateMediaErrorResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                title: UpdateMediaServerErrorResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
    delete:
      summary: Delete media
      description: Deletes the media with the given ID
      operationId: deleteMedia
      tags: [media]
      parameters:
        - $ref: '#/components/parameters/mediaId'
      responses:
        '200':
          description: The media deleted
          content:
            application/json:
              schema:
                title: DeleteMediaResponse
                $ref: '#/components/schemas/DeleteMediaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                title: DeleteMediaUnauthorizedResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Media not found
          content:
            application/json:
              schema:
                title: DeleteMediaNotFoundResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                title: DeleteMediaErrorResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                title: DeleteMediaServerErrorResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
  /media/{mediaId}/process:
    post:
      summary: Process media
      description: Processes the media with the given ID
      operationId: processMedia
      tags: [media]
      parameters:
        - $ref: '#/components/parameters/mediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessingParams'
      responses:
        '201':
          description: The media processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessMediaResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                title: ProcessMediaUnauthorizedResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Media not found
          content:
            application/json:
              schema:
                title: ProcessMediaNotFoundResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                title: ProcessMediaErrorResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                title: ProcessMediaServerErrorResponse
                $ref: './common.yaml#/components/schemas/ErrorResponse' 