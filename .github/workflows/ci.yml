name: Continuous Integration

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

jobs:
  frontend-lint:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: './frontend/.nvmrc'
          cache: 'yarn'
          cache-dependency-path: './yarn.lock'
      
      - name: Install dependencies
        working-directory: ./
        run: yarn install --frozen-lockfile
      
      - name: Generate types
        working-directory: ./
        run: ./scripts/generate-types.sh --frontend-only
      
      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: ./frontend/.next/cache
          key: nextjs-${{ hashFiles('yarn.lock') }}-${{ hashFiles('frontend/**/*.ts', 'frontend/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ hashFiles('yarn.lock') }}-
            nextjs-
      
      - name: Run type check
        run: yarn tsc --noEmit
      
      - name: Run linting
        run: yarn lint
      
      - name: Build application
        run: yarn build

  frontend-unit-tests:
    name: Frontend - Test (Unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: './frontend/.nvmrc'
          cache: 'yarn'
          cache-dependency-path: './yarn.lock'
      
      - name: Install dependencies
        working-directory: ./
        run: yarn install --frozen-lockfile
      
      - name: Generate types
        working-directory: ./
        run: ./scripts/generate-types.sh --frontend-only
      
      - name: Run unit tests with coverage
        run: yarn test:unit --coverage
      
      - name: Upload unit test coverage to Codacy
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
            --coverage-reports coverage/lcov.info \
            --language typescript \
            --partial

  frontend-integration-tests:
    name: Frontend - Test (Integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: './frontend/.nvmrc'
          cache: 'yarn'
          cache-dependency-path: './yarn.lock'
      
      - name: Install dependencies
        working-directory: ./
        run: yarn install --frozen-lockfile
      
      - name: Generate types
        working-directory: ./
        run: ./scripts/generate-types.sh --frontend-only
      
      - name: Run integration tests with coverage
        run: yarn test:integration --coverage
      
      - name: Upload integration test coverage to Codacy
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
            --coverage-reports coverage/lcov.info \
            --language typescript \
            --partial

  frontend-e2e-tests:
    name: Frontend - Test (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: './frontend/.nvmrc'
          cache: 'yarn'
          cache-dependency-path: './yarn.lock'

      - name: Install dependencies
        working-directory: ./
        run: yarn install --frozen-lockfile

      - name: Generate types
        working-directory: ./
        run: ./scripts/generate-types.sh --frontend-only

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: yarn test:e2e:chromium

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  backend-ci:
    name: Backend - Lint, Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.6'
          cache: true
          cache-dependency-path: './server/go.sum'
      
      - name: Setup Node.js (for swagger-cli)
        uses: actions/setup-node@v6
        with:
          node-version-file: './frontend/.nvmrc'
      
      - name: Download Go dependencies
        run: go mod download
      
      - name: Verify Go modules
        run: go mod verify
      
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest

      - name: Generate types
        run: |
          cd ..
          ./scripts/generate-types.sh --backend-only
      
      # https://github.com/h2non/bimg?tab=readme-ov-file#installation
      # https://github.com/libvips/libvips/wiki/Build-for-Ubuntu
      - name: Install bimg dependencies
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: libvips-dev libhdf5-dev
          version: 2.0
      
      # Ubuntu names the pkg-config file hdf5-serial.pc but matio expects hdf5.pc
      - name: Fix HDF5 pkg-config
        working-directory: /usr/lib/x86_64-linux-gnu/pkgconfig
        run: sudo ln -sf hdf5-serial.pc hdf5.pc
      
      # Run fast checks first for quick feedback
      - name: Run Go fmt check
        run: |
          if [ "$(gofmt -s -l . | grep -v "^generated/" | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Please run 'make fmt'"
            gofmt -s -l . | grep -v "^generated/"
            exit 1
          fi
      
      - name: Run Go vet
        run: go vet ./...
      
      - name: Run Go tests with coverage
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out
      
      - name: Convert coverage to Cobertura format
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          go install github.com/boumenot/gocover-cobertura@latest
          gocover-cobertura < coverage.out > coverage.xml
      
      - name: Upload coverage to Codacy
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
            --coverage-reports coverage.xml \
            --language go \
            --partial
      
      - name: Build Go application
        run: go build -o tuneslap .

  finalize-coverage:
    name: Finalize Coverage Report
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [frontend-unit-tests, frontend-integration-tests, backend-ci]
    steps:
      - name: Notify Codacy coverage is complete
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh) final